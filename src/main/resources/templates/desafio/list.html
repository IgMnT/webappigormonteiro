<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Desafios</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('Desafios')}"></th:block>
<div class="container">
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Dificuldade</th>
        <th>Categoria</th>
        <th>Autor</th>
        <th>Linguagem</th>
        <th sec:authorize="hasAnyRole('ADMIN','AUTHOR')">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${desafios}">
        <td th:text="${d.id}"></td>
        <td>
            <strong th:text="${d.titulo}"></strong>
            <p class="small" th:text="${d.descricao}"></p>
        </td>
        <td th:text="${d.dificuldade}"></td>
        <td th:text="${d.categoria != null ? d.categoria.nome : '—'}"></td>
        <td th:text="${d.autor != null ? d.autor.nome : '—'}"></td>
        <td th:text="${d.linguagemUtilizada}"></td>
        <td sec:authorize="hasRole('ADMIN') or (hasRole('AUTHOR') and #authentication?.name == d.autor?.email)">
            <form th:action="@{'/desafios/' + ${d.id} + '/delete'}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-danger">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div class="form-container" sec:authorize="hasAnyRole('ADMIN','AUTHOR')">
    <h2>Novo Desafio</h2>
    <form th:action="@{/desafios}" th:object="${desafioForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Título:
            <input th:field="*{titulo}" required />
        </label>
        <div style="color:red" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        <label>Descrição:
            <textarea th:field="*{descricao}" rows="3" required></textarea>
        </label>
        <div style="color:red" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        <label>Dificuldade:
            <input th:field="*{dificuldade}" required />
        </label>
        <div style="color:red" th:if="${#fields.hasErrors('dificuldade')}" th:errors="*{dificuldade}"></div>
        <div sec:authorize="hasRole('ADMIN')">
            <label>Autor:
                <select th:field="*{autorId}" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.nome}"></option>
                </select>
            </label>
            <div style="color:red" th:if="${#fields.hasErrors('autorId')}" th:errors="*{autorId}"></div>
        </div>
        <div sec:authorize="hasRole('AUTHOR')">
            <input type="hidden" th:field="*{autorId}" th:value="${currentUser != null ? currentUser.id : null}" />
            <p class="small">Autor: <strong th:text="${currentUser != null ? currentUser.nome : 'Você'}"></strong></p>
        </div>
        <label>Categoria:
            <select th:field="*{categoriaId}" required>
                <option value="" disabled selected>Selecione...</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
        </label>
        <div style="color:red" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
        <label>Linguagem:
            <input th:field="*{linguagemUtilizada}" required />
        </label>
        <div style="color:red" th:if="${#fields.hasErrors('linguagemUtilizada')}" th:errors="*{linguagemUtilizada}"></div>
    <button type="submit" class="btn">Salvar</button>
    </form>
</div>

<p sec:authorize="hasRole('ADMIN')"><a th:href="@{/users}">Gerenciar Usuários</a></p>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
