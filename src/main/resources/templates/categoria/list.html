<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Categorias</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('Categorias de Desafios')}"></th:block>
<div class="container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.descricao}"></td>
        </tr>
        </tbody>
    </table>

    <div class="form-container" sec:authorize="hasAnyRole('ADMIN','AUTHOR')">
        <h2>Nova Categoria</h2>
        <form th:action="@{/categorias}" th:object="${categoriaForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label>Nome:
                <input th:field="*{nome}" required/>
            </label>
            <div style="color:red" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

            <label>Descrição:
                <textarea th:field="*{descricao}" rows="3"></textarea>
            </label>
            <div style="color:red" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
            <button type="submit" class="btn">Salvar</button>
        </form>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
