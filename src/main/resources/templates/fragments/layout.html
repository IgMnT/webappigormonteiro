<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <title th:remove="tag">Layout Base</title>
    <!-- Aqui poderia entrar um CSS externo futuramente -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts optional -->
</head>
<body>
<header th:fragment="header(title)">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
        <h1 th:text="${title}">Aplicação</h1>
        <nav style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            <a th:href="@{/principal}">Home</a>
            <a th:href="@{/desafios}" sec:authorize="isAuthenticated()">Desafios</a>
            <a th:href="@{/categorias}" sec:authorize="hasAnyRole('ADMIN','AUTHOR')">Categorias</a>
            <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Usuários</a>
            <a href="/h2-console" target="_blank" sec:authorize="hasRole('ADMIN')">H2</a>
            <span sec:authorize="isAuthenticated()" style="margin-left:auto;display:flex;align-items:center;gap:.5rem;">
                <span>Olá, <strong sec:authentication="name">usuário</strong></span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-link">Sair</button>
                </form>
            </span>
            <a th:href="@{/login}" sec:authorize="isAnonymous()">Entrar</a>
        </nav>
    </div>
</header>

<footer th:fragment="footer">
    <div class="container">
        <span>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Plataforma de Desafios</span>
    </div>
</footer>
</body>
</html>
