<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Não encontrado</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('Conteúdo não encontrado')}"></th:block>
<div class="container">
    <div class="card">
        <p th:text="${mensagem != null ? mensagem : 'Não encontramos o recurso solicitado.'}">
            Não encontramos o recurso solicitado.
        </p>
        <a class="btn" th:href="@{/principal}">Voltar</a>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
