<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Entrar</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('Entrar na Plataforma')}"></th:block>
<div class="container" style="max-width:420px;">
    <div class="card">
        <form th:action="@{/login}" method="post" class="form-container">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label>E-mail
                <input type="email" name="username" placeholder="seu@email.com" required />
            </label>
            <label>Senha
                <input type="password" name="password" placeholder="••••••••" required />
            </label>
            <div th:if="${param.error}" class="alert alert-danger">Credenciais inválidas ou usuário inativo.</div>
            <div th:if="${param.logout}" class="alert alert-success">Sessão encerrada com sucesso.</div>
            <button type="submit" class="btn" style="width:100%;">Entrar</button>
        </form>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
