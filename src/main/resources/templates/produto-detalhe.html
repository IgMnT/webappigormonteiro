<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <title>Produto</title>
        <th:block th:replace="~{fragments/layout :: head}"></th:block>
    </head>
<body>
<th:block th:replace="~{fragments/layout :: header('Produto')}"></th:block>
<div class="container">
    <div class="card">
        <h2 th:text="${produto.nome}">Nome do Produto</h2>
        <p>
                <strong>Descrição:</strong>
                <span th:text="${produto.descricao}">Descrição do Produto</span>
        </p>
        <p>
                <strong>Preço:</strong>
                <span th:text="${produto.preco}">0.00</span>
        </p>
    </div>
    <p class="space-top"><a class="btn" th:href="@{/principal}">Voltar</a></p>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
