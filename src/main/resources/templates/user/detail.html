<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Detalhe Usuário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 1.5rem; }
        .card { border:1px solid #ccc; padding:1rem; border-radius:4px; max-width: 480px; }
        .card h2 { margin-top:0; }
        .label { font-weight:bold; }
        a { color:#0a558c; }
    </style>
</head>
<body>
<a href="/users">&larr; Voltar</a>
<div class="card" th:if="${user != null}">
    <h2 th:text="${user.nome}" aria-label="Nome do usuário">Nome do Usuário</h2>
    <p><span class="label">Email:</span> <span th:text="${user.email}"></span></p>
    <p><span class="label">Status:</span> <span th:text="${user.status}"></span></p>
    <p><span class="label">Role:</span> <span th:text="${user.role}"></span></p>
</div>
<div th:if="${user == null}">
    <p>Usuário não encontrado.</p>
</div>
</body>
</html>
