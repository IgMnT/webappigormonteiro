<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Detalhe Usuário</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('Usuários - Detalhe')}"></th:block>
<div class="container">
<a class="btn" href="/users">&larr; Voltar</a>
<div class="card space-top" th:if="${user != null}">
    <h2 th:text="${user.nome}" aria-label="Nome do usuário">Nome do Usuário</h2>
    <p><span class="label">Email:</span> <span th:text="${user.email}"></span></p>
    <p><span class="label">Status:</span> <span th:text="${user.status}"></span></p>
    <p><span class="label">Role:</span> <span th:text="${user.role}"></span></p>
</div>
<div th:if="${user == null}">
    <p>Usuário não encontrado.</p>
</div>
</div>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
